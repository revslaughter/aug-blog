<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Not a page of the site; keep it out of search results. robots.txt
         disallows it too, and it is absent from the sitemap. -->
    <meta name="robots" content="noindex" />
    <title>Antioch Urban Growers — Editor</title>
  </head>
  <body>
    <!--
      Sveltia CMS is a single-page app served from a CDN, so there is nothing
      to install or build — this file and config.yml beside it are the whole
      integration. `public/` is copied into `out/` verbatim by the static
      export, so this ends up at /admin/ on the deployed site.

      Deliberately no `type="module"` and no stylesheet: the bundle is a
      classic script and ships its own styles. Adding either breaks it.

      The version is pinned on purpose, with a Subresource Integrity hash.
      This page holds a GitHub write credential, so it runs only a reviewed
      release. To upgrade, follow "Updating the editor" in README.md.
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.256.1/dist/sveltia-cms.js"
      integrity="sha384-LPT86oZkLhmoF84O1jKZBSaFJOVvKv8sjXDKap1SOaSwzbC8F6HH7rTJWekmAzG9"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
