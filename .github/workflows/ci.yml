name: CI

# CI runs at promotion only: PRs into beta and main, and pushes to them. A PR
# into alpha gets the local run of scripts/merge-gate.py (gate 1) instead.
# The Security Audit job follows the same triggers.
on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    needs: lint
    # Two zones, neither of them UTC, on purpose. At zero offset a local-time
    # date and a UTC date are the same, so a test that guards against mixing
    # them cannot fail there.
    # Asia/Tokyo (UTC+9) has a positive offset. It catches a date taken from
    # the UTC instant in the recurring all-day code.
    # America/Chicago (UTC-5 or UTC-6) has a negative offset. It catches bugs
    # that show only at a negative offset.
    # fail-fast is off, so a failure in one zone does not hide the other.
    strategy:
      fail-fast: false
      matrix:
        tz:
          - Asia/Tokyo
          - America/Chicago
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  visual:
    name: Screenshots
    runs-on: ubuntu-latest
    needs: lint
    # Only on pull requests into beta or main: the promotions. The job costs
    # about three minutes in a container. Run `npm run baseline:check` locally
    # before a PR into alpha when the change can move the rendering. Pushes to
    # beta and main skip it: the promotion PR already ran it on the same tree.
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'beta' || github.base_ref == 'main')
    # Pixel comparison only means anything if the renderer is identical, so the
    # baselines are pinned to this image — same Chromium build, same FreeType,
    # same font config as `npm run test:visual:update` is expected to use.
    # Keep the tag in step with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v5
      # No setup-node: the image already ships the Node the browsers were
      # built against, and swapping it out is how you get subtle mismatches.
      - run: npm ci
      - run: npm run test:visual
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # Non-blocking on purpose: this job reports, it does not gate. Nothing here
    # is reachable at runtime, so a new advisory is worth reading on the way
    # past, not worth holding a merge over.
    #
    # What made the flag a problem before was not the flag: the job failed on
    # every single run, so `continue-on-error` was covering a permanent failure
    # rather than softening an occasional one, and a check that is always red is
    # one nobody reads. The lockfile audits clean now, so green is the resting
    # state and a red run here means something actually landed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Threshold stays at high even though the tree is currently clean all the
      # way down to moderate. Nothing here is exposed at runtime — the site is
      # `output: "export"`, static HTML/CSS/JS on Netlify with no server, so the
      # Server Actions / Edge / rewrites / Image Optimization advisories that
      # dominate next's feed do not describe anything that exists in production,
      # and postcss and sharp only ever run at build time. Reporting every
      # moderate advisory against build tooling would put this job back where it
      # started — noisy enough to tune out. High is the level worth a look.
      - run: npm audit --audit-level=high
