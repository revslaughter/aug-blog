name: CI

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - 'feature/**'
  pull_request:
    branches:
      - main
      - alpha
      - beta

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  visual:
    name: Screenshots
    runs-on: ubuntu-latest
    needs: lint
    # Pixel comparison only means anything if the renderer is identical, so the
    # baselines are pinned to this image — same Chromium build, same FreeType,
    # same font config as `npm run test:visual:update` is expected to use.
    # Keep the tag in step with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v5
      # No setup-node: the image already ships the Node the browsers were
      # built against, and swapping it out is how you get subtle mismatches.
      - run: npm ci
      - run: npm run test:visual
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true  # non-blocking; static site has no server runtime
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only flag high/critical. Moderate advisories here are all build/dev-time
      # tooling (jest, gray-matter, next's postcss) with no static-site runtime
      # exposure, and their only "fix" is major downgrades — so they're noise.
      - run: npm audit --audit-level=high
